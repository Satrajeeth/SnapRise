version: '3.8'

services:
  # ----------------------
  # DATABASES & BROKERS
  # ----------------------
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./database/.env
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------
  # APIs & SERVICES
  # ----------------------
  auth_api:
    build: ./auth_service
    container_name: auth_api
    restart: on-failure
    env_file:
      - ./auth_service/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  otp_api:
    build: ./otp_service
    container_name: otp_api
    restart: on-failure
    env_file:
      - ./otp_service/.env
    environment:
      DATABASE_URL: ${OTP_DATABASE_URL:-postgresql+asyncpg://app:password@postgres:5432/otp_db}
      SYNC_DATABASE_URL: ${OTP_SYNC_DATABASE_URL:-postgresql+psycopg2://app:password@postgres:5432/otp_db}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  otp_worker:
    build: ./otp_service
    container_name: otp_worker
    restart: on-failure
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - ./otp_service/.env
    environment:
      DATABASE_URL: ${OTP_DATABASE_URL:-postgresql+asyncpg://app:password@postgres:5432/otp_db}
      SYNC_DATABASE_URL: ${OTP_SYNC_DATABASE_URL:-postgresql+psycopg2://app:password@postgres:5432/otp_db}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  board_api:
    build: ./board_service
    container_name: board_api
    restart: on-failure
    env_file:
      - ./board_service/.env
    environment:
      DATABASE_URL: ${BOARD_DATABASE_URL:-postgresql+asyncpg://app:password@postgres:5432/board_db}
      SYNC_DATABASE_URL: ${BOARD_SYNC_DATABASE_URL:-postgresql+psycopg2://app:password@postgres:5432/board_db}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  smtp:
    build: ./smtp-server
    container_name: smtp
    ports:
      - "2525:25"
    restart: always

  frontend:
    build: ./snaprise-frontend
    container_name: snaprise-frontend
    ports:
      - "3000:3000"
    restart: on-failure
    depends_on:
      - auth_api
      - otp_api
      - board_api

volumes:
  postgres_data:
