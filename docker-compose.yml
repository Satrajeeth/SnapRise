services:
  # ----------------------
  # DATABASES & BROKERS
  # ----------------------
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=snaprise_user
      - POSTGRES_PASSWORD=snaprise_password
      - POSTGRES_DB=otp_db
      - AUTH_DATABASE_NAME=auth_db
      - BOARD_DATABASE_NAME=board_db
      - ADMIN_DATABASE_NAME=admin_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10


  # ----------------------
  # APIs & SERVICES
  # ----------------------
  auth_api:
    build: ./auth_service
    container_name: auth_api
    restart: on-failure
    env_file:
      - ./auth_service/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  otp_api:
    build: ./otp_service
    container_name: otp_api
    restart: on-failure
    env_file:
      - ./otp_service/.env
    environment:
      DATABASE_URL: ${OTP_DATABASE_URL:-postgresql+asyncpg://snaprise_user:snaprise_password@postgres:5432/otp_db}
      SYNC_DATABASE_URL: ${OTP_SYNC_DATABASE_URL:-postgresql+psycopg2://snaprise_user:snaprise_password@postgres:5432/otp_db}
      EXPOSE_DEV_OTP: "true"
      SMTP_FALLBACK_ENABLED: "false"
      EMAIL_SEND_SECRET: ${EMAIL_SEND_SECRET:-super-secret-email-key}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  otp_worker:
    build: ./otp_service
    container_name: otp_worker
    restart: on-failure
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - ./otp_service/.env
    environment:
      DATABASE_URL: ${OTP_DATABASE_URL:-postgresql+asyncpg://snaprise_user:snaprise_password@postgres:5432/otp_db}
      SYNC_DATABASE_URL: ${OTP_SYNC_DATABASE_URL:-postgresql+psycopg2://snaprise_user:snaprise_password@postgres:5432/otp_db}
      SMTP_FALLBACK_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  board_api:
    build: ./board_service
    container_name: board_api
    restart: on-failure
    env_file:
      - ./board_service/.env
    environment:
      DATABASE_URL: ${BOARD_DATABASE_URL:-postgresql+asyncpg://snaprise_user:snaprise_password@postgres:5432/board_db}
      SYNC_DATABASE_URL: ${BOARD_SYNC_DATABASE_URL:-postgresql+psycopg2://snaprise_user:snaprise_password@postgres:5432/board_db}
      # Lead outbox drain target (Phase 2). board_service forwards undelivered
      # lead_outbox rows to admin_service; tolerant of admin_api being down.
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin_api:8000}
      ADMIN_INGEST_SECRET: ${ADMIN_INGEST_SECRET:-super-secret-ingest-key}
      # Invitation email delivery (Phase 4). Default 'console' (just logs the
      # link); set EMAIL_DELIVERY_MODE=otp to queue + send real email via otp_api.
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-console}
      OTP_SERVICE_URL: ${OTP_SERVICE_URL:-http://otp_api:8000}
      EMAIL_SEND_SECRET: ${EMAIL_SEND_SECRET:-super-secret-email-key}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  admin_api:
    build: ./admin_service
    container_name: admin_api
    restart: on-failure
    env_file:
      - ./admin_service/.env
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql+asyncpg://snaprise_user:snaprise_password@postgres:5432/admin_db}
      SYNC_DATABASE_URL: ${ADMIN_SYNC_DATABASE_URL:-postgresql+psycopg2://snaprise_user:snaprise_password@postgres:5432/admin_db}
      ADMIN_INGEST_SECRET: ${ADMIN_INGEST_SECRET:-super-secret-ingest-key}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./snaprise-frontend
      args:
        NEXT_PUBLIC_AUTH_SERVICE_URL: http://localhost:8000
        NEXT_PUBLIC_OTP_SERVICE_URL: http://localhost:8001
        NEXT_PUBLIC_BOARD_SERVICE_URL: http://localhost:8002
    container_name: snaprise-frontend
    ports:
      - "3000:3000"
    restart: on-failure
    depends_on:
      - auth_api
      - otp_api
      - board_api

  # Internal admin console (Phase 3). Separate origin/port from the customer app
  # so its localStorage tokens are isolated. NEXT_PUBLIC_* URLs are baked at build
  # from snaprise-backoffice/.env and point at host-published ports.
  backoffice:
    build: ./snaprise-backoffice
    container_name: snaprise-backoffice
    ports:
      - "3001:3000"
    restart: on-failure
    depends_on:
      - auth_api
      - admin_api

volumes:
  postgres_data:
