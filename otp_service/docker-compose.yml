services:
  # ----------------------
  # POSTGRES
  # ----------------------
  postgres:
    image: postgres:16
    container_name: otp_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: otp_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d otp_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ----------------------
  # REDIS
  # ----------------------
  redis:
    image: redis:7
    container_name: otp_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------
  # RABBITMQ
  # ----------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: otp_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------
  # OTP API
  # ----------------------
  otp_api:
    build: .
    container_name: otp_api
    restart: on-failure
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"

  # ----------------------
  # CELERY WORKER
  # ----------------------
  otp_worker:
    build: .
    container_name: otp_worker
    restart: on-failure
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
