services:
  # ----------------------
  # REDIS
  # ----------------------
  redis:
    image: redis:7
    container_name: otp_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------
  # RABBITMQ
  # ----------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: otp_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------
  # OTP API
  # ----------------------
  otp_api:
    build: .
    container_name: otp_api
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: ${OTP_DATABASE_URL:-postgresql+asyncpg://app:password@snaprise_postgres:5432/otp_db}
      SYNC_DATABASE_URL: ${OTP_SYNC_DATABASE_URL:-postgresql+psycopg2://app:password@snaprise_postgres:5432/otp_db}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - default
      - snaprise_shared

  # ----------------------
  # CELERY WORKER
  # ----------------------
  otp_worker:
    build: .
    container_name: otp_worker
    restart: on-failure
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${OTP_DATABASE_URL:-postgresql+asyncpg://app:password@snaprise_postgres:5432/otp_db}
      SYNC_DATABASE_URL: ${OTP_SYNC_DATABASE_URL:-postgresql+psycopg2://app:password@snaprise_postgres:5432/otp_db}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - snaprise_shared

networks:
  default:
    name: otp_service_default
  snaprise_shared:
    external: true
    name: snaprise_shared
