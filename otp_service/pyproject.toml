[project]
name = "otp_service"
version = "0.1.0"
description = "Production-grade OTP microservice for SnapRise"
authors = [{ name = "SnapRise Team" }]
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"