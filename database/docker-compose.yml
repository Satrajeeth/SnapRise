services:
  postgres:
    image: postgres:16
    container_name: snaprise_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - snaprise_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - snaprise_shared

volumes:
  snaprise_postgres_data:

networks:
  snaprise_shared:
    name: snaprise_shared
